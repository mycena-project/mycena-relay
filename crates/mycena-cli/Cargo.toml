[package]
name = "mycena-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
mycena-l0-facade = { path = "../mycena-l0-facade" }
mycena-l1-facade = { path = "../mycena-l1-facade" }
mycena-app = { path = "../mycena-app" }
mycena-coin = { path = "../mycena-coin" }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[features]
raspberry-pi = ["dep:rppal", "dep:ssd1306", "dep:embedded-hal", "dep:linux-embedded-hal"]

[target.'cfg(target_arch = "aarch64")'.dependencies]
rppal = { version = "0.18", optional = true }
ssd1306 = { version = "0.8", optional = true }
embedded-hal = { version = "0.2", optional = true }
linux-embedded-hal = { version = "0.3", optional = true }
