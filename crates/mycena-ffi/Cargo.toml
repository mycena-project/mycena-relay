[package]
name = "mycena-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "uniffi_mycena"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
mycena-core = { path = "../mycena-core" }
mycena-l1-facade = { path = "../mycena-l1-facade" }
mycena-node = { path = "../mycena-node" }
mycena-app = { path = "../mycena-app" }
mycena-coin = { path = "../mycena-coin" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
uniffi = { version = "0.28", features = ["build", "bindgen", "cli"] }
serde_json.workspace = true
once_cell = "1"
uuid.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
