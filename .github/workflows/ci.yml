name: Mycelium CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mycelium-relay-${{ matrix.os }}
      - name: Build relay crates
        run: cargo build -p mycelium-relay -p mycelium-core -p mycelium-node
      - name: Test relay crates
        run: cargo test -p mycelium-relay -p mycelium-core -p mycelium-node
      - name: Clippy
        run: cargo clippy -p mycelium-relay -p mycelium-core -p mycelium-node --all-targets -- -D warnings
      - name: Rustfmt
        run: cargo fmt --all -- --check
